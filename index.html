<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Class Tracker">
  <title>Class Tracker - Secure</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234F46E5' width='100' height='100'/><text y='75' font-size='80' fill='white' text-anchor='middle' x='50'>📚</text></svg>">
</head>
<body>
  <div id="root"></div>

  <script>
    // ⚠️ PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
       apiKey: "AIzaSyDLxCEmP3RchhEwjRULu0ELMg_iLItBfkw",
  authDomain: "class-tracker-7ec05.firebaseapp.com",
  databaseURL: "https://class-tracker-7ec05-default-rtdb.firebaseio.com",
  projectId: "class-tracker-7ec05",
  storageBucket: "class-tracker-7ec05.firebasestorage.app",
  messagingSenderId: "34124797425",
  appId: "1:34124797425:web:9d92e45482eb27cff6e050"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // Icons
    const Calendar = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
    );
    const CheckCircle = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const Settings = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const X = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const LogOut = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    );
    const Lock = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    );
    const Cloud = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
    );

    function LoginScreen({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          await firebase.auth().signInWithEmailAndPassword(email, password);
          // onLogin will be called automatically by auth state change
        } catch (error) {
          setError(error.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full">
            <div className="text-center mb-8">
              <Lock className="w-16 h-16 text-indigo-600 mx-auto mb-4" />
              <h1 className="text-3xl font-bold text-gray-800 mb-2">Class Tracker</h1>
              <p className="text-gray-600">Secure Login</p>
            </div>

            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">
                  Email
                </label>
                <input
                  type="email"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none"
                  placeholder="your@email.com"
                  required
                />
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">
                  Password
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none"
                  placeholder="••••••••"
                  required
                />
              </div>

              {error && (
                <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                  {error}
                </div>
              )}

              <button
                type="submit"
                disabled={loading}
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors disabled:opacity-50"
              >
                {loading ? 'Signing in...' : 'Sign In'}
              </button>
            </form>

            <div className="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
              <p className="text-sm text-blue-800">
                🔒 Your data is secure. Only you can access it with your credentials.
              </p>
            </div>
          </div>
        </div>
      );
    }

    function ClassTracker({ user, onLogout }) {
      const [totalClasses, setTotalClasses] = useState(0);
      const [remainingClasses, setRemainingClasses] = useState(0);
      const [checkedDates, setCheckedDates] = useState(new Set());
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [showSettings, setShowSettings] = useState(false);
      const [tempTotal, setTempTotal] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [lastSynced, setLastSynced] = useState(null);

      const dataRef = firebase.database().ref(`users/${user.uid}/classTracker`);

      useEffect(() => {
        const listener = dataRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            setTotalClasses(data.totalClasses || 0);
            setRemainingClasses(data.remainingClasses || 0);
            setCheckedDates(new Set(data.checkedDates || []));
            setLastSynced(data.lastModified ? new Date(data.lastModified) : new Date());
          }
          // Always set loading to false, even if no data exists yet
          setIsLoading(false);
        }, (error) => {
          // Handle permission denied or other errors
          console.error('Firebase read error:', error);
          alert('Error loading data. Check console for details.');
          setIsLoading(false);
        });

        return () => dataRef.off('value', listener);
      }, []);

      useEffect(() => {
        if (!isLoading && (totalClasses > 0 || checkedDates.size > 0)) {
          const timeoutId = setTimeout(() => {
            saveToFirebase();
          }, 500);

          return () => clearTimeout(timeoutId);
        }
      }, [totalClasses, remainingClasses, checkedDates]);

      const saveToFirebase = async () => {
        try {
          await dataRef.set({
            totalClasses,
            remainingClasses,
            checkedDates: [...checkedDates],
            lastModified: new Date().toISOString()
          });
        } catch (error) {
          console.error('Error saving:', error);
        }
      };

      const handleUpdateTotal = () => {
        const newTotal = parseInt(tempTotal);
        if (!isNaN(newTotal) && newTotal >= 0) {
          const diff = newTotal - totalClasses;
          setTotalClasses(newTotal);
          setRemainingClasses(Math.max(0, remainingClasses + diff));
          setShowSettings(false);
          setTempTotal('');
        }
      };

      const handleDateClick = (dateStr) => {
        const newCheckedDates = new Set(checkedDates);
        
        if (newCheckedDates.has(dateStr)) {
          newCheckedDates.delete(dateStr);
          setRemainingClasses(prev => Math.min(totalClasses, prev + 1));
        } else {
          if (remainingClasses > 0) {
            newCheckedDates.add(dateStr);
            setRemainingClasses(prev => prev - 1);
          }
        }
        
        setCheckedDates(newCheckedDates);
      };

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        return { daysInMonth, startingDayOfWeek, year, month };
      };

      const { daysInMonth, startingDayOfWeek, year, month } = getDaysInMonth(currentMonth);

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      if (isLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center">
              <Cloud className="w-16 h-16 text-indigo-600 mx-auto mb-4 animate-pulse" />
              <div className="text-indigo-600 text-xl">Loading your data...</div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
          <div className="max-w-4xl mx-auto">
            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <Calendar className="w-8 h-8 text-indigo-600" />
                  <h1 className="text-3xl font-bold text-gray-800">Class Tracker</h1>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={onLogout}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                    title="Sign out"
                  >
                    <LogOut className="w-6 h-6 text-gray-600" />
                  </button>
                  <button
                    onClick={() => {
                      setShowSettings(true);
                      setTempTotal(totalClasses.toString());
                    }}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                  >
                    <Settings className="w-6 h-6 text-gray-600" />
                  </button>
                </div>
              </div>
              
              {lastSynced && (
                <div className="text-sm text-gray-500 mb-4 flex items-center gap-2">
                  <Cloud className="w-4 h-4" />
                  <span>Last synced: {lastSynced.toLocaleString()}</span>
                </div>
              )}
              
              <div className="grid grid-cols-3 gap-4">
                <div className="bg-indigo-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-indigo-600 font-medium mb-1">Total Classes</div>
                  <div className="text-3xl font-bold text-indigo-900">{totalClasses}</div>
                </div>
                <div className="bg-green-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-green-600 font-medium mb-1">Remaining</div>
                  <div className="text-3xl font-bold text-green-900">{remainingClasses}</div>
                </div>
                <div className="bg-purple-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-purple-600 font-medium mb-1">Completed</div>
                  <div className="text-3xl font-bold text-purple-900">{checkedDates.size}</div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-xl p-6">
              <div className="flex items-center justify-between mb-6">
                <button
                  onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1))}
                  className="px-4 py-2 bg-indigo-100 hover:bg-indigo-200 rounded-lg font-medium text-indigo-700 transition-colors"
                >
                  ← Previous
                </button>
                <h2 className="text-2xl font-bold text-gray-800">
                  {monthNames[month]} {year}
                </h2>
                <button
                  onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1))}
                  className="px-4 py-2 bg-indigo-100 hover:bg-indigo-200 rounded-lg font-medium text-indigo-700 transition-colors"
                >
                  Next →
                </button>
              </div>

              <div className="grid grid-cols-7 gap-2">
                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                  <div key={day} className="text-center font-semibold text-gray-600 py-2">
                    {day}
                  </div>
                ))}

                {[...Array(startingDayOfWeek)].map((_, i) => (
                  <div key={`empty-${i}`} className="aspect-square" />
                ))}

                {[...Array(daysInMonth)].map((_, i) => {
                  const day = i + 1;
                  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const isChecked = checkedDates.has(dateStr);
                  const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();

                  return (
                    <button
                      key={day}
                      onClick={() => handleDateClick(dateStr)}
                      className={`aspect-square rounded-lg flex items-center justify-center font-semibold transition-all relative
                        ${isChecked 
                          ? 'bg-green-500 text-white hover:bg-green-600 shadow-md' 
                          : 'bg-gray-50 text-gray-700 hover:bg-gray-100'
                        }
                        ${isToday ? 'ring-2 ring-indigo-400' : ''}
                      `}
                    >
                      {day}
                      {isChecked && (
                        <CheckCircle className="w-4 h-4 absolute top-1 right-1" />
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            {showSettings && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl p-6 max-w-md w-full">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-xl font-bold text-gray-800">Update Total Classes</h3>
                    <button
                      onClick={() => setShowSettings(false)}
                      className="p-1 hover:bg-gray-100 rounded-lg"
                    >
                      <X className="w-6 h-6 text-gray-600" />
                    </button>
                  </div>
                  
                  <input
                    type="number"
                    value={tempTotal}
                    onChange={(e) => setTempTotal(e.target.value)}
                    placeholder="Enter total number of classes"
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none mb-4 text-lg"
                    min="0"
                  />
                  
                  <button
                    onClick={handleUpdateTotal}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors"
                  >
                    Update Total
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const unsubscribe = firebase.auth().onAuthStateChanged((user) => {
          setUser(user);
          setLoading(false);
        });

        return unsubscribe;
      }, []);

      const handleLogout = async () => {
        try {
          await firebase.auth().signOut();
        } catch (error) {
          console.error('Logout error:', error);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-indigo-600 text-xl">Loading...</div>
          </div>
        );
      }

      return user ? (
        <ClassTracker user={user} onLogout={handleLogout} />
      ) : (
        <LoginScreen />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
