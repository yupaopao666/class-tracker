<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Class Tracker">
  <title>Class Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%234F46E5' width='100' height='100'/><text y='75' font-size='80' fill='white' text-anchor='middle' x='50'>📚</text></svg>">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    
    // ⚠️ IMPORTANT: Replace this URL with your Google Apps Script Web App URL
    const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbzNoWGyhcAn159CiHNQp_rBjRpzXXynbmM-BZk_cglT7dketdXN73ppS816FfeZ_Kg7/exec';
    
    // CORS Proxy - set to true if accessing from GitHub Pages
    const USE_PROXY = window.location.hostname.includes('github.io');
    const PROXY_URL = 'https://corsproxy.io/?';
    
    // Helper function to get the correct URL
    function getApiUrl() {
      if (USE_PROXY) {
        return PROXY_URL + encodeURIComponent(SHEETS_API_URL);
      }
      return SHEETS_API_URL;
    }
    
    // Icons
    const Calendar = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
    );
    const CheckCircle = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const Settings = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    );
    const X = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    );
    const RefreshCw = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
    );
    const Cloud = ({ className, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
    );

    function ClassTracker() {
      const [totalClasses, setTotalClasses] = useState(0);
      const [remainingClasses, setRemainingClasses] = useState(0);
      const [checkedDates, setCheckedDates] = useState(new Set());
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [showSettings, setShowSettings] = useState(false);
      const [tempTotal, setTempTotal] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [isSaving, setIsSaving] = useState(false);
      const [saveStatus, setSaveStatus] = useState(''); // 'saving', 'saved', 'error'
      const [lastSaved, setLastSaved] = useState(null);

      useEffect(() => {
        loadDataFromSheets();
      }, []);

      // Auto-save whenever data changes (debounced)
      useEffect(() => {
        if (!isLoading && (totalClasses > 0 || checkedDates.size > 0)) {
          const timeoutId = setTimeout(() => {
            saveDataToSheets();
          }, 1000); // Save 1 second after last change

          return () => clearTimeout(timeoutId);
        }
      }, [totalClasses, remainingClasses, checkedDates]);

      const loadDataFromSheets = async () => {
        try {
          const response = await fetch(getApiUrl());
          
          if (!response.ok) {
            throw new Error('Failed to load data from Google Sheets');
          }
          
          const data = await response.json();
          
          if (data.error) {
            throw new Error(data.error);
          }
          
          setTotalClasses(data.totalClasses || 0);
          setRemainingClasses(data.remainingClasses || 0);
          setCheckedDates(new Set(data.checkedDates || []));
          if (data.lastModified) {
            setLastSaved(new Date(data.lastModified));
          }
          
        } catch (error) {
          console.error('Error loading from Google Sheets:', error);
          alert('Failed to load data. Please check:\n1. Your SHEETS_API_URL is correct\n2. The Google Apps Script is deployed\n3. You have internet connection');
        } finally {
          setIsLoading(false);
        }
      };

      const saveDataToSheets = async () => {
        if (isSaving) return; // Prevent multiple simultaneous saves
        
        setIsSaving(true);
        setSaveStatus('saving');
        
        try {
          const data = {
            totalClasses,
            remainingClasses,
            checkedDates: [...checkedDates]
          };

          const response = await fetch(getApiUrl(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
          });

          if (!response.ok) {
            throw new Error('Failed to save data');
          }

          const result = await response.json();
          
          if (result.error) {
            throw new Error(result.error);
          }

          setLastSaved(new Date());
          setSaveStatus('saved');
          
          // Clear "saved" status after 2 seconds
          setTimeout(() => setSaveStatus(''), 2000);
          
        } catch (error) {
          console.error('Error saving to Google Sheets:', error);
          setSaveStatus('error');
          setTimeout(() => setSaveStatus(''), 3000);
        } finally {
          setIsSaving(false);
        }
      };

      const handleUpdateTotal = () => {
        const newTotal = parseInt(tempTotal);
        if (!isNaN(newTotal) && newTotal >= 0) {
          const diff = newTotal - totalClasses;
          setTotalClasses(newTotal);
          setRemainingClasses(Math.max(0, remainingClasses + diff));
          setShowSettings(false);
          setTempTotal('');
        }
      };

      const handleDateClick = (dateStr) => {
        const newCheckedDates = new Set(checkedDates);
        
        if (newCheckedDates.has(dateStr)) {
          newCheckedDates.delete(dateStr);
          setRemainingClasses(prev => Math.min(totalClasses, prev + 1));
        } else {
          if (remainingClasses > 0) {
            newCheckedDates.add(dateStr);
            setRemainingClasses(prev => prev - 1);
          }
        }
        
        setCheckedDates(newCheckedDates);
      };

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        return { daysInMonth, startingDayOfWeek, year, month };
      };

      const { daysInMonth, startingDayOfWeek, year, month } = getDaysInMonth(currentMonth);

      const previousMonth = () => {
        setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1));
      };

      const nextMonth = () => {
        setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1));
      };

      const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      if (isLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center">
              <Cloud className="w-16 h-16 text-indigo-600 mx-auto mb-4 animate-pulse" />
              <div className="text-indigo-600 text-xl">Loading from Google Sheets...</div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4 md:p-8">
          <div className="max-w-4xl mx-auto">
            {/* Header */}
            <div className="bg-white rounded-2xl shadow-xl p-6 mb-6">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-3">
                  <Calendar className="w-8 h-8 text-indigo-600" />
                  <h1 className="text-3xl font-bold text-gray-800">Class Tracker</h1>
                </div>
                <div className="flex items-center gap-2">
                  {/* Save Status Indicator */}
                  <div className="flex items-center gap-2">
                    {saveStatus === 'saving' && (
                      <div className="flex items-center gap-1 text-blue-600 text-sm">
                        <RefreshCw className="w-4 h-4 animate-spin" />
                        <span>Saving...</span>
                      </div>
                    )}
                    {saveStatus === 'saved' && (
                      <div className="flex items-center gap-1 text-green-600 text-sm">
                        <CheckCircle className="w-4 h-4" />
                        <span>Saved</span>
                      </div>
                    )}
                    {saveStatus === 'error' && (
                      <div className="text-red-600 text-sm">
                        Save failed
                      </div>
                    )}
                  </div>
                  
                  <button
                    onClick={() => {
                      setShowSettings(true);
                      setTempTotal(totalClasses.toString());
                    }}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                  >
                    <Settings className="w-6 h-6 text-gray-600" />
                  </button>
                </div>
              </div>
              
              {lastSaved && (
                <div className="text-sm text-gray-500 mb-4 flex items-center gap-2">
                  <Cloud className="w-4 h-4" />
                  <span>Last synced: {lastSaved.toLocaleString()}</span>
                </div>
              )}
              
              {/* Stats */}
              <div className="grid grid-cols-3 gap-4">
                <div className="bg-indigo-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-indigo-600 font-medium mb-1">Total Classes</div>
                  <div className="text-3xl font-bold text-indigo-900">{totalClasses}</div>
                </div>
                <div className="bg-green-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-green-600 font-medium mb-1">Remaining</div>
                  <div className="text-3xl font-bold text-green-900">{remainingClasses}</div>
                </div>
                <div className="bg-purple-50 rounded-xl p-4 text-center">
                  <div className="text-sm text-purple-600 font-medium mb-1">Completed</div>
                  <div className="text-3xl font-bold text-purple-900">{checkedDates.size}</div>
                </div>
              </div>
            </div>

            {/* Calendar */}
            <div className="bg-white rounded-2xl shadow-xl p-6">
              <div className="flex items-center justify-between mb-6">
                <button
                  onClick={previousMonth}
                  className="px-4 py-2 bg-indigo-100 hover:bg-indigo-200 rounded-lg font-medium text-indigo-700 transition-colors"
                >
                  ← Previous
                </button>
                <h2 className="text-2xl font-bold text-gray-800">
                  {monthNames[month]} {year}
                </h2>
                <button
                  onClick={nextMonth}
                  className="px-4 py-2 bg-indigo-100 hover:bg-indigo-200 rounded-lg font-medium text-indigo-700 transition-colors"
                >
                  Next →
                </button>
              </div>

              <div className="grid grid-cols-7 gap-2">
                {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => (
                  <div key={day} className="text-center font-semibold text-gray-600 py-2">
                    {day}
                  </div>
                ))}

                {[...Array(startingDayOfWeek)].map((_, i) => (
                  <div key={`empty-${i}`} className="aspect-square" />
                ))}

                {[...Array(daysInMonth)].map((_, i) => {
                  const day = i + 1;
                  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  const isChecked = checkedDates.has(dateStr);
                  const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();

                  return (
                    <button
                      key={day}
                      onClick={() => handleDateClick(dateStr)}
                      className={`aspect-square rounded-lg flex items-center justify-center font-semibold transition-all relative
                        ${isChecked 
                          ? 'bg-green-500 text-white hover:bg-green-600 shadow-md' 
                          : 'bg-gray-50 text-gray-700 hover:bg-gray-100'
                        }
                        ${isToday ? 'ring-2 ring-indigo-400' : ''}
                      `}
                    >
                      {day}
                      {isChecked && (
                        <CheckCircle className="w-4 h-4 absolute top-1 right-1" />
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Settings Modal */}
            {showSettings && (
              <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl p-6 max-w-md w-full">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-xl font-bold text-gray-800">Update Total Classes</h3>
                    <button
                      onClick={() => setShowSettings(false)}
                      className="p-1 hover:bg-gray-100 rounded-lg"
                    >
                      <X className="w-6 h-6 text-gray-600" />
                    </button>
                  </div>
                  
                  <input
                    type="number"
                    value={tempTotal}
                    onChange={(e) => setTempTotal(e.target.value)}
                    placeholder="Enter total number of classes"
                    className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-indigo-500 focus:outline-none mb-4 text-lg"
                    min="0"
                  />
                  
                  <button
                    onClick={handleUpdateTotal}
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors"
                  >
                    Update Total
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClassTracker />);
  </script>
</body>
</html>
